# Marks this sample Actor as its own pnpm workspace root: without it, a `pnpm install` run in this
# directory walks up, finds the repo root's pnpm-workspace.yaml, and installs the runtime's own
# dependencies instead of this Actor's. The file travels with the directory, so the e2e suite's
# throwaway copies (dev-folder-bind-mount.test.ts) stay standalone too.

# Same reasoning as the root pnpm-workspace.yaml: esbuild (via tsx and vitest) and unrs-resolver
# (via @apify/eslint-config) both resolve their native binary from per-platform packages
# (`@esbuild/*`, `@unrs/resolver-binding-*`), so no dependency here needs its build script.
ignoredBuiltDependencies:
    - esbuild
    - unrs-resolver
