name: Release

# Manual-only: cuts a stable release from master. The version follows the conventional commits since the
# last release (or the bump picked below), CHANGELOG.md and package.json are bumped in a commit pushed to
# master, the GitHub release is tagged on that commit, and the image built from it is published as
# `v<version>` and `latest`.
#
# Changelog generation is the git-cliff setup crawlee-python releases with (apify/actions); the bump
# commit is `_update-changelog.yml`.
on:
    workflow_dispatch:
        inputs:
            release_type:
                description: Release type
                required: true
                type: choice
                default: auto
                options:
                    - auto
                    - custom
                    - patch
                    - minor
                    - major
            custom_version:
                description: The custom version to bump to (only for "custom" type)
                required: false
                type: string
                default: ''

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    wait_for_checks:
        name: Wait for required checks
        runs-on: ubuntu-latest
        permissions:
            checks: read
        steps:
            # Every release pushes its bump commit to master, so a release from any other branch would
            # leave that branch's changes out of the tagged commit.
            - name: Require master
              if: github.ref != 'refs/heads/master'
              run: |
                  echo "::error::Releases are cut from master, not '${{ github.ref_name }}'."
                  exit 1

            - name: Wait for checks
              uses: apify/actions/wait-for-checks@v1.6.1
              with:
                  ref: ${{ github.sha }}
                  check-regexp: '^(Build, lint, unit \+ integration tests|e2e )'

    release_prepare:
        name: Release prepare
        needs: [wait_for_checks]
        runs-on: ubuntu-latest
        outputs:
            version_number: ${{ steps.release_prepare.outputs.version_number }}
            tag_name: ${{ steps.release_prepare.outputs.tag_name }}
            release_notes: ${{ steps.release_prepare.outputs.release_notes }}
            changelog_artifact_name: ${{ steps.release_prepare.outputs.changelog_artifact_name }}
        steps:
            - uses: apify/actions/git-cliff-release@v1.6.1
              name: Release prepare
              id: release_prepare
              with:
                  release_type: ${{ inputs.release_type }}
                  custom_version: ${{ inputs.custom_version }}
                  existing_changelog_path: CHANGELOG.md

    changelog_update:
        name: Changelog update
        needs: [release_prepare]
        permissions:
            contents: write
        uses: ./.github/workflows/_update-changelog.yml
        with:
            version_number: ${{ needs.release_prepare.outputs.version_number }}
            changelog_artifact_name: ${{ needs.release_prepare.outputs.changelog_artifact_name }}
        secrets: inherit

    github_release:
        name: GitHub release
        needs: [release_prepare, changelog_update]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: GitHub release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  tag_name: ${{ needs.release_prepare.outputs.tag_name }}
                  name: ${{ needs.release_prepare.outputs.version_number }}
                  target_commitish: ${{ needs.changelog_update.outputs.changelog_commitish }}
                  body: ${{ needs.release_prepare.outputs.release_notes }}

    docker_image:
        name: Docker image
        needs: [release_prepare, changelog_update, github_release]
        uses: ./.github/workflows/build-image.yml
        with:
            ref: ${{ needs.changelog_update.outputs.changelog_commitish }}
            extra_tag: ${{ needs.release_prepare.outputs.tag_name }}
            latest: true
        secrets: inherit
