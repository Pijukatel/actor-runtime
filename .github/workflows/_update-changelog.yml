name: Update changelog

# Shared by `release.yml` and `changelog.yml`: writes the changelog generated by
# apify/actions/git-cliff-release into CHANGELOG.md, optionally bumps package.json, and pushes both to
# the dispatching branch in one signed commit. Modeled on apify/workflows'
# python_bump_and_update_changelog.yaml, which crawlee-python releases with.
on:
    workflow_call:
        inputs:
            version_number:
                description: Version to set in package.json (no leading "v"). Empty leaves package.json alone.
                type: string
                required: false
                default: ''
            changelog_artifact_name:
                description: Name of the artifact holding the changelog, as uploaded by apify/actions/git-cliff-release
                type: string
                required: true
        secrets:
            APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN:
                required: true
        outputs:
            changelog_commitish:
                description: Git HEAD after the commit and push
                value: ${{ jobs.update_changelog.outputs.changelog_commitish }}

jobs:
    update_changelog:
        name: Update changelog
        runs-on: ubuntu-latest
        outputs:
            changelog_commitish: ${{ steps.commit.outputs.commit_long_sha }}
        steps:
            # The service account's token, so the commit can be pushed to the protected master.
            - uses: actions/checkout@v4
              with:
                  token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

            - name: Update package version in package.json
              if: inputs.version_number != ''
              env:
                  VERSION_NUMBER: ${{ inputs.version_number }}
              run: npm pkg set "version=${VERSION_NUMBER}"

            # An artifact rather than a string input: inputs reach a step as environment variables, which
            # Linux caps at 128 KiB each, and the full changelog outgrows that.
            - uses: actions/download-artifact@v4
              with:
                  name: ${{ inputs.changelog_artifact_name }}
                  path: ${{ runner.temp }}/changelog

            - name: Update CHANGELOG.md
              env:
                  DOWNLOADED_CHANGELOG: ${{ runner.temp }}/changelog/CHANGELOG.md
              run: |
                  if [ ! -s "$DOWNLOADED_CHANGELOG" ]; then
                    echo "::error::Artifact '${{ inputs.changelog_artifact_name }}' holds no non-empty CHANGELOG.md"
                    exit 1
                  fi
                  mv "$DOWNLOADED_CHANGELOG" CHANGELOG.md

            - name: Commit changes
              id: commit
              uses: apify/actions/signed-commit@v1.6.1
              with:
                  message: "${{ inputs.version_number != '' && 'chore(release): Update changelog and package version [skip ci]' || 'chore(release): Update changelog [skip ci]' }}"
                  pull: '--rebase --autostash'
                  github-token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
