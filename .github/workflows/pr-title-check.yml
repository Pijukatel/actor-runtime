name: PR title check

# Enforces Conventional Commits PR titles: git-cliff builds CHANGELOG.md from the squash-merge commits,
# which take their message from the PR title. Mirrors crawlee-python's on_pull_request.yaml.
on:
    pull_request:
        # `edited` re-runs the check when only the title changes.
        types: [opened, edited, synchronize, reopened]

permissions:
    contents: read
    pull-requests: read

jobs:
    pr_title_check:
        name: PR title check
        runs-on: ubuntu-latest
        steps:
            - uses: apify/actions/pr-title-check@v1.6.1
