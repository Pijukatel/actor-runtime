<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Actor Runtime Console</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a1a; background: #f6f7f9; }
    header { background: #0d1117; color: #fff; padding: 12px 20px; font-weight: 600; }
    main { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
    .panel { background: #fff; border: 1px solid #e2e5e9; border-radius: 8px; padding: 14px; }
    #left-column { display: flex; flex-direction: column; gap: 16px; width: 260px; flex: none; }
    #nav-panel { width: auto; }
    #actors { width: auto; }
    #detail { flex: 1; min-width: 0; }
    h2 { font-size: 15px; margin: 0 0 10px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 6px 8px; border-radius: 6px; cursor: pointer; }
    li:hover { background: #eef1f4; }
    button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
    button.secondary { background: #6e7681; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    .SUCCEEDED { background: #d5f5e3; color: #1e7e46; }
    .FAILED, .ABORTED, .TIMED-OUT { background: #fddede; color: #b42318; }
    .RUNNING, .READY { background: #fdf1d6; color: #9a6700; }
    pre { background: #0d1117; color: #d6deeb; padding: 10px; border-radius: 6px; overflow: auto; max-height: 280px; font-size: 12px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; border-bottom: 1px solid #eee; padding: 4px 6px; vertical-align: top; }
    .muted { color: #6e7681; font-size: 12px; }
    .clickable { color: #1f6feb; cursor: pointer; }
    .tabs { display: flex; gap: 8px; margin: 10px 0; }
    .tabs span { cursor: pointer; padding: 4px 10px; border-radius: 6px; background: #eef1f4; font-size: 13px; }
    .tabs span.active { background: #1f6feb; color: #fff; }
    /* Top-level category nav is a vertical list in the side panel: one per row. */
    #top-tabs { flex-direction: column; align-items: stretch; gap: 4px; margin-top: 0; }
    header .spacer { flex: 1; }
    header { display: flex; align-items: center; gap: 12px; }
    header .user { font-weight: 400; font-size: 13px; color: #8b949e; }
    header button { font-size: 12px; padding: 4px 10px; }
    /* Actor "Input" tab: schema-generated Form view + raw JSON view. Scoped
       under #input-tab (the container `renderInputTab` renders into, see
       app.js's `openActor`) so these rules never reach the pre-existing
       "New user name"/"New name" inputs or the header's #user-select. */
    #input-tab input[type="text"], #input-tab input[type="number"], #input-tab select, #input-tab textarea {
      font: inherit; padding: 4px 6px; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box;
    }
    #input-tab textarea { width: 100%; font-family: ui-monospace, monospace; font-size: 12px; resize: vertical; }
    #input-json-editor { min-height: 260px; }
    .input-field { margin-bottom: 14px; }
    .input-field-label { display: flex; align-items: baseline; gap: 4px; font-weight: 600; font-size: 13px; margin-bottom: 2px; }
    .input-field-help { margin-bottom: 4px; }
    .input-required { color: #b42318; font-weight: 700; }
    .input-error { color: #b42318; font-size: 12px; min-height: 14px; }
    /* Zero the gap above the first section heading -- but "first" means
       "not preceded by another .input-section sibling", not literally
       `:first-child`: a schema whose leading properties have no
       `sectionCaption` (e.g. the sample Actor's own `greeting`) renders
       before any `.input-section` wrapper exists (see `renderFormFields` in
       input_tab.js), so the first actual `.input-section` is never the body's
       first DOM child and `:first-child` never matches it. The
       general-sibling rule below restores normal spacing only for a
       section that genuinely follows another section, regardless of what
       unsectioned fields precede the first one. */
    .input-section h3 { font-size: 14px; margin: 0 0 4px; }
    .input-section ~ .input-section h3 { margin-top: 16px; }
    .string-list-row { display: flex; gap: 6px; margin-bottom: 6px; }
    .string-list-row input { flex: 1; }
    .string-list-rows { margin-bottom: 6px; }
    .json-subfield textarea { min-height: 90px; }
  </style>
</head>
<body>
  <header>
    <span>Actor Runtime Console</span>
    <span class="spacer"></span>
    <span class="user">Acting as <strong id="current-user">…</strong></span>
    <label class="user" for="user-select">Switch user
      <select id="user-select"></select>
    </label>
    <label class="user" for="fallback-toggle">API fallback
      <input type="checkbox" id="fallback-toggle" />
    </label>
  </header>
  <main>
    <div id="left-column">
      <div id="nav-panel" class="panel">
        <div id="top-tabs" class="tabs">
          <span id="tab-actors" class="active">Actors</span>
          <span id="tab-storage">Storage</span>
          <span id="tab-users">Users</span>
        </div>
      </div>
      <div id="actors" class="panel">
        <ul id="actor-list"></ul>
      </div>
    </div>
    <div id="detail" class="panel">
      <p class="muted">Select an item to inspect its details and storages.</p>
    </div>
  </main>
  <script src="/console/input_tab.js"></script>
  <script src="/console/app.js"></script>
</body>
</html>
