# Single-package project - this file exists only to hold pnpm settings (pnpm 10 reads them from
# here, not from a `pnpm` field in package.json). No `packages` list on purpose: `sample_actor_ts`
# is a standalone npm-based fixture with its own package-lock.json (see the README's "Package
# manager" section), never a workspace member.

# None of these packages need their build scripts (pnpm 10 blocks dependency build scripts unless
# approved, and lists anything undeclared in an install-time warning - this list is the explicit
# decision that silences it): esbuild loads its binary from the `@esbuild/*` platform packages,
# protobufjs's postinstall is a no-op version check, and ssh2/cpu-features only try to compile
# optional native crypto bindings and fall back to pure JS - under npm that compile already failed
# silently in the build-tool-less `node:24-bookworm-slim` image, so nothing ever ran with them.
ignoredBuiltDependencies:
    - cpu-features
    - esbuild
    - protobufjs
    - ssh2
