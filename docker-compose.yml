services:
    actor-runtime:
        build: .
        image: actor-runtime:local
        container_name: actor-runtime
        ports:
            - '3333:3333'
            - '3000:3000'
        volumes:
            - actor-runtime-data:/data
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            # Uncomment to make the runtime's own Apify Proxy password available to every Actor container:
            # APIFY_PROXY_PASSWORD: your-password
            ACTOR_RUNTIME_DATA_DIR: /data

volumes:
    actor-runtime-data:
